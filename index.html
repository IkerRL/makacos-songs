<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maka Songs - Omen Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="omen-bg"></div>
    <div class="bg-energy-core"></div>
    <div class="noise-overlay"></div>

    <header class="main-header">
        <h1 class="titulo-principal" data-subtitle="MAKACAGOTICA">PRIMATES SONGS</h1>
    </header>

    <main class="grid-equipos" id="grid-canciones"></main>

    <!-- MODAL DE ZOOM -->
    <div class="team-modal" id="modal-zoom" onclick="cerrarModal()">
        <div class="team-modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="cerrarModal()">✕</button>
            
            <div class="modal-img-container">
                <img src="" id="zoom-img" alt="Portada">
            </div>

            <div class="modal-info-side">
                <div class="modal-user-row">
                    <span>👤</span>
                    <span id="zoom-user">Usuario</span>
                </div>
                
                <h2 class="modal-song-title" id="zoom-titulo">Nombre de la Canción</h2>
                
                <!-- REPRODUCTOR PRO -->
                <div class="modal-player">
                    <div class="player-controls">
                        <button class="audio-icon-btn" id="btn-atras">
                            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                        </button>
                        
                        <button class="audio-icon-btn main-play" id="btn-play">▶</button>
                        
                        <button class="audio-icon-btn" id="btn-adelante">
                            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                        </button>
                    </div>

                    <div class="player-timeline">
                        <div class="player-bar-bg" id="barra-bg">
                            <div class="player-bar-fill" id="barra-fill"></div>
                        </div>
                        <span class="player-time" id="tiempo-texto">0:00 / 0:00</span>
                    </div>

                    <div class="volume-control">
                        <span class="vol-icon">🔊</span>
                        <input type="range" id="volumen-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>

                <div class="modal-score-row">
                    <span class="score-label">MEDIA</span>
                    <span class="score-value" id="score-media">—</span>
                </div>

                <div class="modal-icons-row">
                    <div class="jurado-placeholder" id="jurado-row"></div>
                    <div class="icon-twitch" id="btn-twitch">
                        <span class="twitch-dot"></span>
                        <span class="twitch-label">CHAT</span>
                        <span class="twitch-count"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
